# Exact versions the pipeline was verified against.
#
# Generated with:  .venv/Scripts/python.exe -m pip freeze --exclude-editable
# Verified:        2026-10-02, 100 checks passing, 23 positions published.
#
# Use this file, not pyproject.toml, when reproducing the environment. The lock
# pins dependencies only, so the package itself is installed from the tree:
#
#     python -m venv .venv
#     .venv/Scripts/python.exe -m pip install -r requirements.lock
#     .venv/Scripts/python.exe -m pip install -e . --no-deps
#     .venv/Scripts/python.exe -m playwright install chromium
#
# --no-deps on the second step matters: without it pip re-resolves the ranges
# in pyproject.toml and can move a package past the version pinned here, which
# is exactly what this file exists to prevent.
#
# pyproject.toml declares the dependency *ranges* and stays authoritative for
# what the code may use; this file records what it was actually run against.
#
# Why pin at all: editing a range in pyproject.toml made pip upgrade transitive
# packages, and typing_extensions disappeared from the environment between two
# runs. pydantic imports it on every use, so the next pipeline run died with
# "ModuleNotFoundError: typing_extensions" before reaching the crawl. A lock
# makes the upgrade a deliberate act instead of a side effect.
#
# Chromium: playwright's bundled build comes from cdn.playwright.dev, which
# returns 403 "this service is not available in your location" from Iran. The
# crawler uses the installed Chrome instead; the install step above is only
# needed on a machine without it.

