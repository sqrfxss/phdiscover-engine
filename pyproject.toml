[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phdiscover-engine"
version = "0.1.0"
description = "PI-First PhD Position Discovery Engine - Autonomous, Evidence-Backed, Iran-Operable"
readme = "README.md"
authors = [{name = "Saeid Soraghi", email = "saeidsoraghi6@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
# Only what the code actually imports. The previous list was the original
# design doc: crawlee>=3.7 does not exist (the package stops at 0.6), and
# sentence-transformers, torch, aioredis, pgvector, sqlalchemy and alembic were
# never imported. They broke `pip install .` on every runner, so CI and Deploy
# failed before either could run a single test.
#
# Anything heavier lives in optional-dependencies, so the crawl installs fast
# and the newsletter/bot can be added without a database stack.
dependencies = [
    # HTTP + parsing
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "playwright>=1.45",
    # models + logging
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    # discovery agents
    "pyalex>=3.0",
    "ddgs>=4.0",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
newsletter = [
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
]
telegram = [
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10",
]
ui = [
    "streamlit>=1.40",
    "typer>=0.12",
    "rich>=13.7",
]
# src/phdiscover/db/ imports these; no live database is configured.
database = [
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "black>=24.3",
    "isort>=5.13",
]
deploy = [
    "docker>=7.0",
]
all = [
    "phdiscover-engine[newsletter,telegram,ui,database]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["phdiscover*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T20", "PIE", "PT", "Q", "SIM", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "RET", "SLF", "TID", "EXE", "ISC", "ICN", "PERF", "LOG", "PTH"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src/phdiscover"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]