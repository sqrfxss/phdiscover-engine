version: '3.8'

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: phdiscover-postgres
    environment:
      POSTGRES_DB: phdiscover
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phdiscover-network

  # Redis (Upstash-compatible)
  redis:
    image: redis:7-alpine
    container_name: phdiscover-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phdiscover-network

  # Main Application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: phdiscover-app
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/phdiscover
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - EXA_API_KEY=${EXA_API_KEY}
      - OPENALEX_EMAIL=${OPENALEX_EMAIL}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY}
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src
    volumes:
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      - ../scripts:/app/scripts:ro
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phdiscover-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # Crawler Worker (separate for scaling)
  crawler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: phdiscover-crawler
    command: python -m phdiscover.crawlers.run_all
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/phdiscover
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src
    volumes:
      - ../src:/app/src:ro
      - ../config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phdiscover-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Scheduler Service
  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: phdiscover-scheduler
    command: python -m phdiscover.scheduler.run
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/phdiscover
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src
    volumes:
      - ../src:/app/src:ro
      - ../config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phdiscover-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  # Telegram Bot (can run separately for scaling)
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: phdiscover-bot
    command: python -m phdiscover.bot.run
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/phdiscover
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src
    volumes:
      - ../src:/app/src:ro
      - ../config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phdiscover-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

volumes:
  postgres_data:
  redis_data:

networks:
  phdiscover-network:
    driver: bridge