# GitHub Actions CI/CD Workflows

# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e .[dev]

      - name: Run Ruff (linting)
        run: ruff check src/ tests/ scripts/

      - name: Run Ruff (format check)
        run: ruff format --check src/ tests/ scripts/

      - name: Run MyPy (type checking)
        run: mypy src/

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=src/phdiscover --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: phdiscover-engine:latest
          load: true

      - name: Test Docker image
        run: |
          docker run --rm phdiscover-engine:latest python -c "import phdiscover; print('Import OK')"

  deploy-staging:
    needs: build-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to Railway/Render staging"
          # Add deployment commands here

  notify:
    needs: [lint-and-test, build-docker]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify on failure
        if: failure()
        run: |
          echo "CI failed - check GitHub Actions"