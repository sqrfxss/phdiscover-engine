name: CI
true:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
env:
  PYTHON_VERSION: '3.11'
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
    - name: Install
      run: 'python -m pip install -U pip

        pip install -e . ruff

        '
    - name: Lint
      continue-on-error: true
      run: ruff check src/ scripts/ --select=E9,F63,F7,F82,F401
    - name: Import check
      run: python -c "import phdiscover, phdiscover.cache, phdiscover.deadlines, phdiscover.reliability;
        print('imports OK')"
    - name: Reliability, pagination and deadline checks
      run: 'python scripts/test_reliability.py

        python scripts/test_pagination.py

        python scripts/test_deadlines.py

        '
    - name: University board detection
      run: python scripts/test_university_boards.py
    - name: End-to-end crawl against a local fake board
      run: python scripts/test_stale_stop.py
    - name: Config and published-data sanity
      run: 'python scripts/check_published.py

        '
  locked-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install exactly what the lock records
      run: 'python -m pip install -U pip

        pip install -r requirements.lock

        pip install -e . --no-deps

        '
    - name: The lock is complete
      run: "python - <<'PY'\nimport sys\nfrom importlib.metadata import version, PackageNotFoundError\n\
        \nIMPORT_TO_DIST = {\n    \"bs4\": \"beautifulsoup4\",\n    \"yaml\": \"PyYAML\"\
        ,\n    \"dotenv\": \"python-dotenv\",\n    \"httpx\": \"httpx\",\n    \"lxml\"\
        : \"lxml\",\n    \"playwright\": \"playwright\",\n    \"pydantic\": \"pydantic\"\
        ,\n    \"pydantic_settings\": \"pydantic-settings\",\n    \"typing_extensions\"\
        : \"typing_extensions\",\n    \"structlog\": \"structlog\",\n    \"pyalex\"\
        : \"pyalex\",\n    \"ddgs\": \"ddgs\",\n    \"rapidfuzz\": \"rapidfuzz\",\n\
        }\n\npinned = {}\nwith open(\"requirements.lock\", encoding=\"utf-8\") as\
        \ fh:\n    for line in fh:\n        if \"==\" in line and not line.strip().startswith(\"\
        #\"):\n            name, want = line.strip().split(\"==\", 1)\n          \
        \  pinned[name.lower().replace(\"_\", \"-\")] = want\n\nmissing, unpinned,\
        \ drifted = [], [], []\nfor imp, dist in sorted(IMPORT_TO_DIST.items()):\n\
        \    try:\n        have = version(dist)\n    except PackageNotFoundError:\n\
        \        missing.append(f\"{imp} (distribution {dist})\")\n        continue\n\
        \    want = pinned.get(dist.lower().replace(\"_\", \"-\"))\n    if want is\
        \ None:\n        unpinned.append(f\"{dist}=={have}\")\n    elif have.lower()\
        \ != want.lower():\n        drifted.append(f\"{dist}: {have} != {want}\")\n\
        \nfor label, rows in ((\"not installed\", missing),\n                    (\"\
        installed but not pinned\", unpinned),\n                    (\"installed at\
        \ a different version\", drifted)):\n    for row in rows:\n        print(f\"\
        ::error::{row} - {label}\")\nif not (missing or unpinned or drifted):\n  \
        \  print(f\"lock is complete: {len(IMPORT_TO_DIST)} required packages pinned\"\
        )\nsys.exit(1 if (missing or unpinned or drifted) else 0)\nPY\n"
    - name: The checks pass on the locked environment
      run: 'python scripts/test_reliability.py

        python scripts/test_pagination.py

        python scripts/test_deadlines.py

        python scripts/test_stale_stop.py

        python scripts/check_published.py

        '
