# PhDiscover — scheduled crawl
#
# Runs on GitHub's runners, outside the Iranian network. That matters: several
# boards here are unreachable or throttled from Iran but respond normally from
# a US or EU runner, so this workflow is strictly more reliable than the local
# pipeline. The local one is still useful — it is where a new source gets
# debugged — but the published data comes from here.
#
# Required repository setting:
#   Settings -> Actions -> General -> Workflow permissions -> Read and write
# The job commits web/data/, so it needs write access to the repository.
#
# Security note: no untrusted input reaches a `run:` block. workflow_dispatch
# inputs are booleans only, and nothing interpolates a title, body, or branch.

name: Crawl and publish

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose: scheduled workflows queue behind
    # everyone else's, and the top of the hour is the worst slot to pick.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      probe_only:
        description: 'Only probe reachability, do not crawl'
        type: boolean
        default: false

concurrency:
  # Never let two crawls write web/data/ at once. The last one to finish wins
  # otherwise, and half a dataset is worse than a late one.
  group: crawl
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install httpx[http2] beautifulsoup4 lxml pyyaml playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Self-test before crawling
        # If the retry/cache logic is broken, the crawl output is not
        # trustworthy. Fail here rather than publishing bad data.
        run: python scripts/test_reliability.py

      - name: Probe source health
        run: python scripts/probe_sources.py

      - name: Discover university boards (weekly)
        # One-off sweep over ~6,000 homepages to find where each university's
        # vacancy board actually lives. Deliberately not daily: the results are
        # cached in config/university_boards.json, and a university whose board
        # has moved is caught here rather than by re-searching every day.
        # Board URLs change on the order of once a year, so weekly is generous.
        if: github.event_name == 'schedule'
        run: python scripts/crawl_universities.py --missing-only --csv config/universities.csv

      - name: Crawl all boards
        run: bash scripts/crawl_all_boards.py

      - name: Filter to doctoral biomechanics positions
        run: python scripts/filter_and_merge.py

      - name: Enrich from detail pages
        run: python scripts/enrich_positions.py

      - name: Publish to web/data
        run: python scripts/publish_site.py

      - name: Regenerate coverage report
        run: python scripts/coverage_report.py

      - name: Sanity check the result
        # A run that publishes zero positions is almost always a bug, not an
        # empty market. Refuse to overwrite good data in that case.
        run: |
          python - <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("web/data/ranked_opportunities.json")
          n = len(json.loads(p.read_text(encoding="utf-8")))
          print(f"positions published: {n}")
          if n == 0:
              print("::error::crawl produced 0 positions; keeping previous data")
              sys.exit(1)
          PY

      - name: Publish the site
        # gh-pages holds the site at its root (index.html, data/, ...), so the
        # worktree receives the freshly crawled data/ and the reports, not a
        # copy of web/. Copying web/ over would nest the site one level down and
        # break every relative path in index.html.
        run: |
          set -euo pipefail
          git config user.name  'phdiscover-bot'
          git config user.email 'actions@github.com'

          git fetch --depth=1 origin gh-pages
          git worktree add ../ghpages gh-pages

          # web/data/ is what the crawl produced; the page markup is unchanged
          # and already lives on gh-pages.
          rm -rf ../ghpages/data
          cp -R web/data ../ghpages/data
          if [ -f data/COVERAGE.md ]; then cp data/COVERAGE.md ../ghpages/COVERAGE.md; fi
          if [ -f data/coverage_report.json ]; then cp data/coverage_report.json ../ghpages/coverage_report.json; fi

          # Guard against publishing an empty site.
          test -f ../ghpages/data/ranked_opportunities.json
          test "$(python -c 'import json;print(len(json.load(open("../ghpages/data/ranked_opportunities.json"))))')" -gt 0

          git -C ../ghpages add -A
          if git -C ../ghpages diff --staged --quiet; then
            echo "site unchanged"
          else
            git -C ../ghpages commit -m "crawl: update positions"
            git -C ../ghpages push origin gh-pages
          fi
          git worktree remove ../ghpages --force

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-data
          path: |
            data/crawl_v2.json
            data/coverage_report.json
            data/COVERAGE.md
          retention-days: 30
          if-no-files-found: ignore

      # Hand this run's postings to the local machine, so the next local
      # pipeline can merge them. A local run reaches different boards: it walks
      # more pages where the network allows, and it found 5 EURAXESS positions
      # in one measured run that the runner did not. One run overwrites the
      # other unless both are kept.
      - name: Publish the crawl for the local merge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-for-local
          path: data/crawl_v2.json
          retention-days: 3
          if-no-files-found: ignore
